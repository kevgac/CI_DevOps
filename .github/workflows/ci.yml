name: CI + Docker + GHCR (versioned)

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: image
        run: |
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}/ci-demo" | tr '[:upper:]' '[:lower:]')
          echo "image=$IMAGE_NAME" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build -t ${{ steps.image.outputs.image }}:latest .

      - name: Tag image
        run: |
          docker tag ${{ steps.image.outputs.image }}:latest \
            ${{ steps.image.outputs.image }}:sha-${GITHUB_SHA::7}

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            docker tag ${{ steps.image.outputs.image }}:latest \
              ${{ steps.image.outputs.image }}:$VERSION
          fi

      - name: Push images
        run: |
          docker push ${{ steps.image.outputs.image }}:latest
          docker push ${{ steps.image.outputs.image }}:sha-${GITHUB_SHA::7}

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            docker push ${{ steps.image.outputs.image }}:$VERSION
          fi
