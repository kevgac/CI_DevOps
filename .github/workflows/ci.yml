name: CI + Docker + GHCR (PR & main)

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set image name
        id: image
        run: |
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}/ci-demo" | tr '[:upper:]' '[:lower:]')
          echo "image=$IMAGE_NAME" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ steps.image.outputs.image }}:latest .

      - name: Tag image
        if: github.event_name != 'pull_request'
        run: |
          docker tag ${{ steps.image.outputs.image }}:latest \
            ${{ steps.image.outputs.image }}:sha-${GITHUB_SHA::7}

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            docker tag ${{ steps.image.outputs.image }}:latest \
              ${{ steps.image.outputs.image }}:$VERSION
          fi

      - name: Push images
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ steps.image.outputs.image }}:latest
          docker push ${{ steps.image.outputs.image }}:sha-${GITHUB_SHA::7}

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            docker push ${{ steps.image.outputs.image }}:$VERSION
          fi
